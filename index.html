<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨枝甘露盲盒</title>
    <style>
        :root {
            --bg-color: #f5f4f1;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #666666;
            --accent: #d97757;
            --accent-hover: #c46347;
            --border: #e6e4df;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
        }
        .nav {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            font-size: 14px;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active {
            color: var(--accent);
            font-weight: bold;
            border-bottom: 2px solid var(--accent);
        }
        .content {
            padding: 24px;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-main);
        }
        .form-hint {
            font-size: 12px;
            color: #999999;
            font-weight: normal;
            display: block;
            margin-top: 2px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #faf9f7;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button.primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.primary:hover {
            background-color: var(--accent-hover);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 24px;
            padding: 16px;
            background: #fdfaf8;
            border: 1px solid #f2e6e1;
            border-radius: 8px;
        }
        .status-box p {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--text-main);
        }
        .list-toggle {
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .name-list {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
        }
        .name-list.show {
            display: block;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #fdfaf8;
            border: 1px dashed var(--accent);
            border-radius: 8px;
            display: none;
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: var(--text-light);
        }
        .result-box p {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="container">
        <div class="header">
            <h1>杨枝甘露盲盒</h1>
        </div>
        
        <div class="nav">
            <button class="nav-btn active" onclick="switchTab('register')">我要报名</button>
            <button class="nav-btn" onclick="switchTab('query')">查询分配</button>
            <button class="nav-btn" onclick="switchTab('admin')">管理</button>
        </div>

        <div class="content">
            <div id="register" class="section active">
                <div class="form-group">
                    <label>你的昵称（查询时需要用到）</label>
                    <input type="text" id="reg-name" placeholder="输入昵称">
                </div>
                <div class="form-group">
                    <label>你的地址</label>
                    <textarea id="reg-address" placeholder="详细地址+联系方式（仅对方可见）"></textarea>
                    <span class="form-hint">※ 需要手机号和地址，但别填名字</span>
                </div>
                <button class="primary" id="btn-submit" onclick="submitRegister()">提交报名</button>

                <div class="status-box">
                    <p>当前报名人数：<strong id="user-count">0</strong> 人</p>
                    <span class="list-toggle" onclick="toggleList()">查看已报名名单</span>
                    <div class="name-list" id="user-list">（暂无数据）</div>
                </div>
            </div>

            <div id="query" class="section">
                <div class="form-group">
                    <label>输入你的报名昵称</label>
                    <input type="text" id="query-name" placeholder="你报名时填的昵称">
                </div>
                <button class="primary" id="btn-query" onclick="submitQuery()">查询我要送给谁</button>

                <div class="result-box" id="query-result">
                    <h3>你需要送往的地址：</h3>
                    <p id="target-address"></p>
                </div>
            </div>

            <div id="admin" class="section">
                <div class="form-group">
                    <label>管理员暗号</label>
                    <input type="password" id="admin-pwd" placeholder="输入暗号">
                </div>
                <button class="primary" id="btn-assign" onclick="submitAssign()">截止报名并触发分配</button>
                <p style="font-size: 12px; color: var(--text-light); margin-top: 12px;">注：点击分配后，系统会将地址随机打乱。每个人都不会抽到自己。</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxp7_QvVOUL2cl1-rRog4ujANkFImRaTeYu-nHi5SYqJtdg6TzpQnpDoze76SpNaTNV/exec"; 
        
        let refreshTimer = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'register') {
                loadList();
                refreshTimer = setInterval(loadList, 20000);
            } else {
                clearInterval(refreshTimer);
            }
        }

        function toggleList() {
            document.getElementById('user-list').classList.toggle('show');
        }

        async function requestGas(data, btnId) {
            const btn = document.getElementById(btnId);
            if(btn) { btn.disabled = true; btn.innerText = "处理中..."; }
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(data)
                });
                const res = await response.json();
                
                if(btn) { btn.disabled = false; btn.innerText = btn.dataset.originalText || "确认"; }
                return res;
            } catch (err) {
                if(btn) { btn.disabled = false; btn.innerText = btn.dataset.originalText || "确认"; }
                showToast("网络请求失败");
                console.error(err);
                return { success: false, message: "网络异常" };
            }
        }

        async function submitRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const addr = document.getElementById('reg-address').value.trim();
            if (!name || !addr) return showToast("昵称和地址不能为空");

            document.getElementById('btn-submit').dataset.originalText = "提交报名";
            const res = await requestGas({ action: 'register', nickname: name, address: addr }, 'btn-submit');
            
            if (res.success) {
                showToast("报名成功！");
                document.getElementById('reg-name').value = '';
                document.getElementById('reg-address').value = '';
                loadList();
            } else {
                showToast(res.message);
            }
        }

        async function loadList() {
            const res = await requestGas({ action: 'getList' }, null);
            if (res.success) {
                document.getElementById('user-count').innerText = res.count;
                document.getElementById('user-list').innerText = res.count === 0 ? '（暂无数据）' : res.list.join('，');
            }
        }

        async function submitQuery() {
            const name = document.getElementById('query-name').value.trim();
            if (!name) return showToast("请输入昵称");

            document.getElementById('btn-query').dataset.originalText = "查询我要送给谁";
            const res = await requestGas({ action: 'query', nickname: name }, 'btn-query');
            
            const resultBox = document.getElementById('query-result');
            if (res.success) {
                document.getElementById('target-address').innerText = res.address;
                resultBox.style.display = 'block';
            } else {
                resultBox.style.display = 'none';
                showToast(res.message);
            }
        }

        async function submitAssign() {
            const pwd = document.getElementById('admin-pwd').value;
            if (!pwd) return showToast("请输入密码");

            document.getElementById('btn-assign').dataset.originalText = "截止报名并触发分配";
            const res = await requestGas({ action: 'assign', password: pwd }, 'btn-assign');
            showToast(res.message || (res.success ? "分配成功" : "分配失败"));
        }

        window.onload = () => { loadList(); refreshTimer = setInterval(loadList, 20000); };
    </script>
</body>
</html>
