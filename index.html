<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘小盲盒</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root{--bg:#f5f4f1;--card:#ffffff;--text:#333333;--light:#666666;--accent:#d97757;--ah:#c46347;--border:#e6e4df;--green:#4a9e6b;--red:#c0392b;}
        *{box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:20px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
        .container{background:var(--card);width:100%;max-width:440px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.05);overflow:hidden;}
        .header{padding:24px;text-align:center;border-bottom:1px solid var(--border);}
        .header h1{margin:0;font-size:20px;font-weight:500;user-select:none;-webkit-user-select:none;cursor:default;}
        .nav{display:flex;border-bottom:1px solid var(--border);}
        .nav-btn{flex:1;padding:12px 6px;text-align:center;background:none;border:none;font-size:14px;color:var(--light);cursor:pointer;transition:all .2s;}
        .nav-btn.active{color:var(--accent);font-weight:bold;border-bottom:2px solid var(--accent);}
        .content{padding:24px;}
        .section{display:none;}.section.active{display:block;}
        .form-group{margin-bottom:16px;}
        .form-group label{display:block;margin-bottom:6px;font-size:14px;}
        .form-hint{font-size:12px;color:#999;font-weight:normal;display:block;margin-top:2px;}
        input,textarea,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;font-family:inherit;background:#faf9f7;}
        input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;}
        textarea{resize:none;min-height:40px;overflow-y:hidden;}
        button.primary{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;transition:background .2s;}
        button.primary:hover{background:var(--ah);}
        button.secondary{width:100%;padding:12px;background:#737373;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;margin-top:12px;transition:background .2s;}
        button.secondary:hover{background:#525252;}
        button.danger{width:100%;padding:12px;background:#b94040;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;margin-top:12px;transition:background .2s;}
        button.danger:hover{background:#8f2e2e;}
        button:disabled{opacity:.4;cursor:not-allowed;}
        .status-box{margin-top:24px;padding:16px;background:#fdfaf8;border:1px solid #f2e6e1;border-radius:8px;}
        .status-box p{margin:0 0 8px 0;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
        .refresh-link{color:var(--accent);font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:opacity .2s;}
        .refresh-link:hover{opacity:.8;}
        .refresh-link.loading{opacity:.6;pointer-events:none;}
        .refresh-link.loading svg{animation:spin .8s linear infinite;}
        .refresh-link svg{transition:transform .3s;}
        @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
        .list-toggle{color:var(--accent);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;}
        .name-list{display:none;margin-top:10px;font-size:14px;color:var(--light);line-height:1.6;}
        .name-list.show{display:block;}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:4000;}
        .radio-group,.checkbox-group{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;margin-top:4px;}
        .radio-group label,.checkbox-group label{display:inline-flex;align-items:center;font-size:14px;cursor:pointer;}
        .radio-group input,.checkbox-group input{width:auto;margin-right:6px;background:none;}
        .dropdown-container{border:1px solid var(--border);border-radius:6px;padding:10px;background:#faf9f7;margin-top:6px;display:none;max-height:200px;overflow-y:auto;}
        .dropdown-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
        .result-box{margin-top:20px;padding:16px;background:#fdfaf8;border:1px dashed var(--accent);border-radius:8px;display:none;}
        .result-box h3{margin:0 0 4px 0;font-size:14px;color:var(--light);}
        .result-box p{margin:0 0 12px 0;font-size:15px;font-weight:500;white-space:pre-wrap;word-break:break-all;}
        .result-box p:last-child{margin-bottom:0;}

        /* 提醒按钮 */
        .remind-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
        .remind-title{font-size:13px;color:var(--light);margin:0 0 10px 0;}
        .remind-btns{display:flex;gap:8px;}
        .remind-btn{flex:1;padding:9px 4px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;width:auto;}
        .remind-btn:hover{background:var(--accent);color:#fff;}

        /* 捎话 */
        .msg-wrap{margin-top:14px;}
        .msg-toggle{font-size:13px;color:var(--light);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted;}
        .msg-toggle:hover{color:var(--accent);}
        .msg-area{margin-top:10px;display:none;}
        .msg-area textarea{min-height:70px;font-size:14px;}
        .msg-action-btns{display:flex;gap:8px;margin-top:8px;}
        .msg-action-btns button{flex:1;padding:8px;border:none;border-radius:6px;font-size:14px;cursor:pointer;width:auto;}
        .msg-btn-send{background:var(--accent);color:#fff;transition:background .2s;}
        .msg-btn-send:hover{background:var(--ah);}
        .msg-btn-cancel{background:var(--border);color:var(--text);}

        /* 收件箱 */
        .inbox-wrap{margin-top:14px;}
        .inbox-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fdfaf8;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .2s;}
        .inbox-bar:hover{border-color:var(--accent);}
        .inbox-icon{color:var(--light);display:flex;align-items:center;flex-shrink:0;}
        .inbox-label{font-size:14px;color:var(--text);flex:1;}
        .inbox-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;}
        .inbox-chevron{color:var(--light);transition:transform .2s;}
        .inbox-chevron.open{transform:rotate(180deg);}
        .inbox-content{display:none;margin-top:8px;}
        .inbox-empty{font-size:13px;color:#bbb;text-align:center;padding:16px 0;}
        .msg-item{padding:12px 0;border-bottom:1px solid var(--border);}
        .msg-item:last-child{border-bottom:none;}
        .msg-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
        .msg-item-tag{font-size:11px;color:#aaa;background:#f5f4f1;padding:2px 8px;border-radius:10px;}
        .msg-item-time{font-size:11px;color:#bbb;}
        .msg-item-content{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:8px;}
        .reply-toggle{font-size:12px;color:var(--light);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
        .reply-toggle:hover{color:var(--accent);}
        .reply-area{margin-top:8px;display:none;}
        .reply-area textarea{min-height:50px;font-size:13px;}
        .reply-action-btns{display:flex;gap:6px;margin-top:6px;}
        .reply-action-btns button{flex:1;padding:7px;border:none;border-radius:5px;font-size:13px;cursor:pointer;width:auto;}
        .reply-btn-send{background:var(--accent);color:#fff;}
        .reply-btn-cancel{background:var(--border);color:var(--text);}

        /* 收货记录 */
        .feedback-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
        .feedback-header span{font-size:14px;color:var(--light);}
        .feedback-table{width:100%;border-collapse:collapse;font-size:13px;}
        .feedback-table th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--border);color:var(--light);font-weight:500;white-space:nowrap;}
        .feedback-table td{padding:10px 6px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-all;}
        .feedback-table tr:last-child td{border-bottom:none;}
        .empty-cell{color:#bbb;font-style:italic;}
        .btn-fill{padding:4px 10px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;width:auto;}
        .btn-fill:hover{background:var(--accent);color:#fff;}
        .btn-fill.modify{border-color:#888;color:#888;}
        .btn-fill.modify:hover{background:#888;color:#fff;}
        .guess-correct{color:var(--green);font-weight:600;}
        .guess-wrong s{color:#bbb;}
        .guess-wrong .actual{color:var(--red);font-weight:600;margin-left:4px;}

        /* 管理员下拉 */
        .qs-drop{border:1px solid var(--border);border-radius:6px;font-size:14px;}
        .qs-drop summary{padding:10px;cursor:pointer;list-style:none;color:var(--text);}
        .qs-drop summary::-webkit-details-marker{display:none;}
        .qs-drop .query-check-list{padding:8px 10px;border-top:1px solid var(--border);max-height:160px;overflow-y:auto;}
        .qs-drop .select-all-link{display:block;padding:4px 10px 8px;}
        .query-check-list{display:flex;flex-direction:column;gap:6px;}
        .query-check-list label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}
        .query-check-list input{width:auto;margin:0;}
        .select-all-link{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block;}
        .query-table{width:100%;border-collapse:collapse;font-size:13px;}
        .query-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--light);font-weight:500;white-space:nowrap;min-width:100px;}
        .query-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word;min-width:100px;}
        .query-table tr:last-child td{border-bottom:none;}
        .query-table .nm{font-weight:500;}

        /* 侧边抽屉 */
        .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:998;}
        .drawer-overlay.show{display:block;}
        .drawer{position:fixed;right:-320px;top:0;width:320px;height:100vh;background:var(--card);z-index:999;box-shadow:-4px 0 24px rgba(0,0,0,.12);transition:right .3s ease;overflow:hidden;display:flex;flex-direction:column;}
        .drawer.open{right:0;}
        .drawer-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
        .drawer-title{font-size:14px;font-weight:500;color:var(--light);}
        .drawer-close{background:none;border:none;cursor:pointer;color:var(--light);padding:4px;display:flex;align-items:center;width:auto;}
        .drawer-close:hover{color:var(--text);}
        .drawer-body{padding:20px;padding-bottom:48px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
        .drawer-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
        .drawer-section-title{font-size:13px;color:var(--light);margin:0 0 12px 0;font-weight:500;}
        .drawer-note{font-size:12px;color:var(--light);margin-top:12px;line-height:1.6;}

        /* 浮动锁按钮 */
        .float-lock{display:none;position:fixed;right:0;top:50%;transform:translateY(-50%);background:var(--card);border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;padding:12px 10px;cursor:pointer;box-shadow:-2px 0 12px rgba(0,0,0,.08);z-index:990;color:var(--light);transition:color .2s,background .2s;}
        .float-lock:hover{background:#f5f4f1;color:var(--accent);}

        /* 神秘弹窗 */
        .secret-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:3000;align-items:center;justify-content:center;}
        .secret-overlay.show{display:flex;}
        .secret-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px 28px;width:260px;text-align:center;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.12);}
        .secret-title{margin:0 0 6px 0;font-size:17px;font-weight:500;color:var(--text);letter-spacing:.5px;}
        .secret-display{height:36px;line-height:36px;font-size:16px;letter-spacing:6px;color:var(--accent);margin-bottom:24px;min-height:36px;overflow:hidden;text-overflow:clip;padding:0 4px;}
        .secret-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
        .secret-key{background:var(--bg);border:1px solid var(--border);border-radius:10px;height:48px;font-size:18px;font-weight:400;color:var(--text);cursor:pointer;transition:background .15s,transform .1s;display:flex;align-items:center;justify-content:center;width:100%;}
        .secret-key:active{background:var(--border);transform:scale(.95);}
        .secret-key.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none;}
        .secret-key.del{font-size:15px;color:var(--light);}
        .secret-foot{display:flex;gap:10px;}
        .secret-cancel{flex:1;padding:11px;background:var(--border);color:var(--text);border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:background .2s;width:auto;}
        .secret-cancel:hover{background:#d8d5cf;}
        .secret-confirm{flex:1;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:background .2s;width:auto;}
        .secret-confirm:hover{background:var(--ah);}
        @keyframes secretShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}35%{transform:translateX(8px)}55%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
        .secret-box.shake{animation:secretShake .45s ease;}

        /* Toggle开关 */
        .toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
        .toggle-switch input{opacity:0;width:0;height:0;}
        .toggle-slider{position:absolute;cursor:pointer;inset:0;background:#ddd;border-radius:24px;transition:.2s;}
        .toggle-slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
        .toggle-switch input:checked + .toggle-slider{background:var(--accent);}
        .toggle-switch input:checked + .toggle-slider:before{transform:translateX(20px);}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;padding:20px;}
        .modal-overlay.show{display:flex;}
        .modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.15);}
        .modal-title{font-size:16px;font-weight:500;margin-bottom:4px;}
        .modal-subtitle{font-size:13px;color:var(--light);margin-bottom:20px;}
        .modal-form-group{margin-bottom:14px;}
        .modal-form-group label{display:block;font-size:13px;margin-bottom:5px;}
        .modal-btns{display:flex;gap:10px;margin-top:20px;}
        .modal-btns button{flex:1;padding:11px;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
        .modal-btn-confirm{background:var(--accent);color:#fff;transition:background .2s;}
        .modal-btn-confirm:hover{background:var(--ah);}
        .modal-btn-cancel{background:var(--border);color:var(--text);}
    </style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- 神秘弹窗 -->
<div class="secret-overlay" id="secretOverlay" onclick="handleOverlayClick(event)">
    <div class="secret-box" id="secretBox">
        <p class="secret-title">请输入密码</p>
        <div class="secret-display" id="secretDisplay"></div>
        <div class="secret-numpad">
            <button class="secret-key" onclick="secretInput('1')">1</button>
            <button class="secret-key" onclick="secretInput('2')">2</button>
            <button class="secret-key" onclick="secretInput('3')">3</button>
            <button class="secret-key" onclick="secretInput('4')">4</button>
            <button class="secret-key" onclick="secretInput('5')">5</button>
            <button class="secret-key" onclick="secretInput('6')">6</button>
            <button class="secret-key" onclick="secretInput('7')">7</button>
            <button class="secret-key" onclick="secretInput('8')">8</button>
            <button class="secret-key" onclick="secretInput('9')">9</button>
            <button class="secret-key empty"></button>
            <button class="secret-key" onclick="secretInput('0')">0</button>
            <button class="secret-key del" onclick="secretDelete()">⌫</button>
        </div>
        <div class="secret-foot">
            <button class="secret-cancel" onclick="closeSecret()">取消</button>
            <button class="secret-confirm" onclick="verifySecret()">确认</button>
        </div>
    </div>
</div>

<!-- 浮动锁按钮 -->
<button class="float-lock" id="floatLock" onclick="toggleDrawer()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
</button>

<!-- 抽屉遮罩 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>

<!-- 管理员抽屉 -->
<div class="drawer" id="adminDrawer">
    <div class="drawer-header">
        <span class="drawer-title">管理员操作区</span>
        <button class="drawer-close" onclick="toggleDrawer()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="drawer-body">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;">
            <span style="font-size:13px;color:var(--light);line-height:1.5">允许互送<br><span style="font-size:11px;color:#bbb">关闭后两人不会互相对送</span></span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-mutual" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <button class="primary" id="btn-assign" onclick="submitAssign()">截止报名并触发邮件分配</button>
        <button class="secondary" id="btn-reveal" onclick="submitReveal()">公布答案</button>
        <button class="danger" id="btn-reset" onclick="submitReset()">重置表格（开启新一轮）</button>
        <p class="drawer-note">分配完成后数据保留供查询；揭晓后收货记录页面将显示猜测结果；重置将清空全部数据含消息记录。</p>

        <div class="drawer-section">
            <p class="drawer-section-title">信息查询</p>
            <div style="display:flex;gap:10px;margin-bottom:14px">
                <div style="flex:1">
                    <details class="qs-drop" id="nickDrop">
                        <summary id="nickSummary">选择成员（0）</summary>
                        <div class="query-check-list" id="nicknameChecks"></div>
                        <span class="select-all-link" onclick="selectAll('nicknameChecks');updSummary()">全选/取消</span>
                    </details>
                </div>
                <div style="flex:1">
                    <details class="qs-drop" id="fieldDrop">
                        <summary id="fieldSummary">查询字段（0）</summary>
                        <div class="query-check-list" id="fieldChecks">
                            <label><input type="checkbox" value="diet" onchange="updSummary()"> 忌口要求</label>
                            <label><input type="checkbox" value="wishlist" onchange="updSummary()"> 小小心愿</label>
                            <label><input type="checkbox" value="time" onchange="updSummary()"> 可点时间</label>
                            <label><input type="checkbox" value="categories" onchange="updSummary()"> 接受种类</label>
                            <label><input type="checkbox" value="remarks" onchange="updSummary()"> 品类备注</label>
                        </div>
                        <span class="select-all-link" onclick="selectAll('fieldChecks');updSummary()">全选/取消</span>
                    </details>
                </div>
            </div>
            <div style="display:flex;gap:8px">
                <button class="primary" id="btn-query-admin" onclick="adminQuery()" style="flex:1">查询</button>
                <button id="btn-capture" onclick="captureResult()" style="padding:12px 14px;background:#555;color:#fff;border:none;border-radius:6px;cursor:pointer;display:none;width:auto">存图</button>
            </div>
            <div style="overflow-x:auto;margin-top:4px"><div id="adminQueryResult"></div></div>
        </div>
    </div>
</div>


<!-- 填写收到记录 Modal -->
<div class="modal-overlay" id="feedbackModal">
    <div class="modal-box">
        <p class="modal-title" id="modal-title-text">填写收到记录</p>
        <p class="modal-subtitle" id="modal-name-hint">昵称：</p>
        <div class="modal-form-group">
            <label>验证密码（报名时设的4位密码）</label>
            <input type="password" id="modal-pwd" inputmode="numeric" maxlength="4" placeholder="输入密码">
        </div>
        <div class="modal-form-group">
            <label>收到时间</label>
            <input type="text" id="modal-time" placeholder="例：15:30">
        </div>
        <div class="modal-form-group">
            <label>收到了什么</label>
            <textarea id="modal-content" placeholder="描述一下你收到的外卖～" style="min-height:60px"></textarea>
        </div>
        <div class="modal-form-group">
            <label>猜是谁送的</label>
            <select id="modal-guess"><option value="">-- 我猜是…… --</option></select>
        </div>
        <div class="modal-btns">

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxUDNY65ZQ6FRANNPLPBXO0uvnbAVE7wE4YWdeQf3jnfcs579sDarDZYCQWPi9u9KWsVQ/exec";
    let refreshTimer = null;
    let currentNicknameList = [];
    let modalTargetNickname = '';
    let cachedMessages = [];
    let inboxOpen = false;
    let currentQueryName = '';
    let currentQueryPwd = '';
    let adminUnlocked = false;
    let isAssigned = false;
    let currentFeedbacks = [];
    let pressTimer = null;

    // ── 时间格式化 ──
    function fmtTime(raw) {
        if (!raw) return '';
        if (/^\d{2}-\d{2} \d{2}:\d{2}$/.test(raw)) return raw;
        const d = new Date(raw);
        if (isNaN(d.getTime())) return raw;
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        const h = String(d.getHours()).padStart(2,'0');
        const min = String(d.getMinutes()).padStart(2,'0');
        return m+'-'+day+' '+h+':'+min;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.style.opacity = '1';
        setTimeout(() => { t.style.opacity='0'; }, 3000);
    }

    document.querySelectorAll('textarea.auto-grow').forEach(el => {
        el.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });
    });

    function toggleInputDisplay(id, show) {
        const el = document.getElementById(id);
        el.style.display = show ? 'block' : 'none';
        if (!show) { el.value=''; if (el.classList.contains('auto-grow')) el.style.height='auto'; }
    }

    function handleCategoryAny(cb) {
        if (cb.checked) {
            document.getElementById('cate-select').checked = false;
            document.getElementById('cate-remark').checked = false;
            toggleInputDisplay('cate-dropdown', false);
            toggleInputDisplay('reg-remarks-input', false);
            document.querySelectorAll('input[name="food-cate"]').forEach(c => c.checked=false);
        }
    }

    function syncCategoryChoice() {
        if (document.querySelectorAll('input[name="food-cate"]:checked').length > 0)
            document.getElementById('cate-any').checked = false;
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (btn) btn.classList.add('active');
        clearInterval(refreshTimer);
        if (tabId === 'register') { loadList(); refreshTimer = setInterval(loadList, 20000); }
        else if (tabId === 'feedback') { loadFeedback(); refreshTimer = setInterval(loadFeedback, 20000); }
    }

    function toggleList() { document.getElementById('user-list').classList.toggle('show'); }

    async function requestGas(data, btnId) {
        const btn = btnId ? document.getElementById(btnId) : null;
        if (btn) { btn.disabled=true; btn.dataset.oldText=btn.innerText; btn.innerText='处理中...'; }
        try {
            const res = await (await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(data) })).json();
            if (btn) { btn.disabled=false; btn.innerText=btn.dataset.oldText; }
            return res;
        } catch(err) {
            if (btn) { btn.disabled=false; btn.innerText=btn.dataset.oldText; }
            showToast("网络请求失败"); return { success:false, message:"网络异常" };
        }
    }

    async function submitRegister() {
        const name = document.getElementById('reg-name').value.trim();
        const pwd = document.getElementById('reg-pwd').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const addr = document.getElementById('reg-address').value.trim();
        if (!name||!pwd||!email||!addr) return showToast("昵称、密码、邮箱、地址均为必填项");
        if (pwd.length!==4||isNaN(pwd)) return showToast("密码必须是4位数字");
        const timeChoice = document.querySelector('input[name="time-choice"]:checked').value;
        const time = timeChoice==='填写' ? document.getElementById('reg-time-input').value.trim() : "我都行！";
        if (timeChoice==='填写'&&!time) return showToast("请填写具体的时间范围");
        let categories = "无所谓";
        if (document.getElementById('cate-select').checked) {
            const chosen = Array.from(document.querySelectorAll('input[name="food-cate"]:checked')).map(c=>c.value);
            if (!chosen.length) return showToast("请选择具体接受的种类");
            categories = chosen.join('、');
        }
        const remarks = document.getElementById('cate-remark').checked ? document.getElementById('reg-remarks-input').value.trim() : "无";
        if (document.getElementById('cate-remark').checked&&!remarks) return showToast("请填写品类备注");
        const diet = document.querySelector('input[name="diet-choice"]:checked').value==='有' ? document.getElementById('reg-diet').value.trim() : "无";
        if (document.querySelector('input[name="diet-choice"]:checked').value==='有'&&!diet) return showToast("请填写忌口要求");
        const wishlist = document.querySelector('input[name="wish-choice"]:checked').value==='有' ? document.getElementById('reg-wish-input').value.trim() : "无";
        if (document.querySelector('input[name="wish-choice"]:checked').value==='有'&&!wishlist) return showToast("请写下你的愿望");
        const res = await requestGas({ action:'register', nickname:name, password:pwd, email, address:addr, time, categories, remarks, diet, wishlist }, 'btn-submit');
        if (res.success) {
            showToast("报名成功！");
            ['reg-name','reg-pwd','reg-email','reg-address','reg-time-input','reg-remarks-input','reg-diet','reg-wish-input'].forEach(id => { document.getElementById(id).value=''; });
            document.getElementById('cate-any').checked=true;
            ['cate-select','cate-remark'].forEach(id => document.getElementById(id).checked=false);
            document.querySelectorAll('input[name="food-cate"]').forEach(c=>c.checked=false);
            document.querySelectorAll('input[name="time-choice"]')[0].checked=true;
            document.querySelectorAll('input[name="diet-choice"]')[0].checked=true;
            document.querySelectorAll('input[name="wish-choice"]')[0].checked=true;
            ['reg-time-input','cate-dropdown','reg-remarks-input','reg-diet','reg-wish-input'].forEach(id=>toggleInputDisplay(id,false));
            loadList();
        } else { showToast(res.message); }
    }

    async function loadList() {
        const res = await requestGas({ action:'getList' }, null);
        if (res.success) {
            currentNicknameList = res.list||[];
            document.getElementById('user-count').innerText = res.count;
            document.getElementById('user-list').innerText = res.count===0 ? '（暂无数据）' : res.list.join('，');
        }
    }

    async function triggerRefresh() {
        const link = document.getElementById('refreshLink');
        const text = link.querySelector('span');
        if (link.classList.contains('loading')) return;
        link.classList.add('loading'); text.innerText='查询中...';
        await loadList();
        setTimeout(() => { link.classList.remove('loading'); text.innerText='刷新'; showToast("名单已同步最新状态"); }, 300);
    }

    async function triggerFeedbackRefresh() {
        const link = document.getElementById('feedbackRefreshLink');
        const text = link.querySelector('span');
        if (link.classList.contains('loading')) return;
        link.classList.add('loading'); text.innerText='刷新中...';
        await loadFeedback();
        setTimeout(() => { link.classList.remove('loading'); text.innerText='刷新'; }, 300);
    }

    async function submitQuery() {
        const name = document.getElementById('query-name').value.trim();
        const pwd = document.getElementById('query-pwd').value.trim();
        if (!name||!pwd) return showToast("昵称和密码不能为空");
        const res = await requestGas({ action:'query', nickname:name, password:pwd }, 'btn-query');
        const box = document.getElementById('query-result');
        if (res.success) {
            currentQueryName=name; currentQueryPwd=pwd;
            document.getElementById('target-address').innerText = res.address;
            document.getElementById('target-diet').innerText = res.diet;
            document.getElementById('target-time').innerText = res.time;
            document.getElementById('target-categories').innerText = res.categories;
            document.getElementById('target-remarks').innerText = res.remarks;
            document.getElementById('target-wishlist').innerText = res.wishlist;
            box.style.display='block';
            loadInbox(name, pwd);
        } else { box.style.display='none'; showToast(res.message); }
    }

    async function submitRemind(type) {
        const name = document.getElementById('query-name').value.trim();
        const pwd = document.getElementById('query-pwd').value.trim();
        const labels = {1:'准备点单',2:'已下单',3:'骑手取货'};
        if (!confirm("确定发送「"+labels[type]+"」提醒给对方吗？（匿名发送）")) return;
        const res = await requestGas({ action:'remind', nickname:name, password:pwd, remindType:type }, 'btn-remind'+type);
        showToast(res.message);
    }

    function toggleMessage() {
        const area = document.getElementById('msgArea');
        const showing = area.style.display==='block';
        area.style.display = showing ? 'none' : 'block';
        if (!showing) document.getElementById('msgContent').focus();
        else document.getElementById('msgContent').value='';
    }

    async function sendMessage() {
        const content = document.getElementById('msgContent').value.trim();
        if (!content) return showToast("请输入内容");
        const res = await requestGas({ action:'sendMessage', nickname:currentQueryName, password:currentQueryPwd, content }, 'btn-send-msg');
        showToast(res.message);
        if (res.success) { document.getElementById('msgContent').value=''; document.getElementById('msgArea').style.display='none'; }
    }

    async function loadInbox(name, pwd) {
        const res = await requestGas({ action:'getInbox', nickname:name, password:pwd }, null);
        if (!res.success) return;
        cachedMessages = res.messages||[];
        const unread = cachedMessages.filter(m=>!m.isRead).length;
        document.getElementById('inboxWrap').style.display='block';
        const badge = document.getElementById('inboxBadge');
        if (unread>0) { badge.style.display='inline-block'; badge.textContent=unread; }
        else { badge.style.display='none'; }
    }

    function toggleInbox() {
        inboxOpen = !inboxOpen;
        document.getElementById('inboxContent').style.display = inboxOpen ? 'block' : 'none';
        document.getElementById('inboxChevron').classList.toggle('open', inboxOpen);
        if (inboxOpen) {
            renderMessages();
            requestGas({ action:'markRead', nickname:currentQueryName, password:currentQueryPwd }, null);
            document.getElementById('inboxBadge').style.display='none';
        }
    }

    function renderMessages() {
        const list = document.getElementById('msgList');
        if (!cachedMessages.length) { list.innerHTML='<p class="inbox-empty">暂无消息</p>'; return; }
        list.innerHTML = cachedMessages.map(m => {
            const tag = m.isReply ? '回话' : '新消息';
            const canReply = !m.isReply;
            return '<div class="msg-item">'
                + '<div class="msg-item-header"><span class="msg-item-tag">'+tag+'</span><span class="msg-item-time">'+fmtTime(m.time)+'</span></div>'
                + '<div class="msg-item-content">'+escHtml(m.content)+'</div>'
                + (canReply ? '<span class="reply-toggle" onclick="toggleReply(\''+m.msgId+'\')">回话</span>'
                    + '<div class="reply-area" id="reply-'+m.msgId+'">'
                    + '<textarea placeholder="写下回话内容…"></textarea>'
                    + '<div class="reply-action-btns">'
                    + '<button class="reply-btn-cancel" onclick="toggleReply(\''+m.msgId+'\')">取消</button>'
                    + '<button class="reply-btn-send" onclick="sendReply(\''+m.msgId+'\')">发送</button>'
                    + '</div></div>' : '')
                + '</div>';
        }).join('');
    }

    function toggleReply(msgId) {
        const area = document.getElementById('reply-'+msgId);
        const showing = area.style.display==='block';
        area.style.display = showing ? 'none' : 'block';
        if (!showing) area.querySelector('textarea').focus();
    }

    async function sendReply(msgId) {
        const area = document.getElementById('reply-'+msgId);
        const content = area.querySelector('textarea').value.trim();
        if (!content) return showToast("请输入回话内容");
        const res = await requestGas({ action:'replyMessage', nickname:currentQueryName, password:currentQueryPwd, msgId, content }, null);
        showToast(res.message);
        if (res.success) { area.style.display='none'; area.querySelector('textarea').value=''; }
    }

    function escHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── 收货记录 ──
    async function loadFeedback() {
        const res = await requestGas({ action:'getFeedback' }, null);
        if (!res.success) { showToast("加载失败，请重试"); return; }
        currentFeedbacks = res.feedbacks||[];
        isAssigned = !!res.assigned;
        const revealed = res.revealed;
        document.getElementById('feedback-status').textContent = revealed ? '答案已揭晓' : '实时动态（每20秒自动刷新）';

        // 揭晓后锁住公布答案按钮
        if (revealed) {
            const btn = document.getElementById('btn-reveal');
            if (btn) { btn.disabled=true; }
            sessionStorage.setItem('revealDone','1');
        }

        const wrap = document.getElementById('feedback-table-wrap');
        if (!currentFeedbacks.length) { wrap.innerHTML='<p style="text-align:center;color:#bbb;font-size:14px;padding:20px 0">还没有人收到哦，等等吧～</p>'; return; }
        let html = '<table class="feedback-table"><thead><tr><th>昵称</th><th>收到时间</th><th>收到了什么</th><th>猜是谁</th>'+(revealed?'':'<th></th>')+'</tr></thead><tbody>';
        currentFeedbacks.forEach(f => {
            let guessCell = '';
            if (revealed && f.revealResult) {
                if (f.revealResult==='✓') guessCell='<span class="guess-correct">'+(f.guess||'—')+' ✓</span>';
                else guessCell='<span class="guess-wrong"><s>'+(f.guess||'未猜')+'</s><span class="actual">→ '+f.revealResult+'</span></span>';
            } else { guessCell = f.guess||'<span class="empty-cell">未填</span>'; }
            const hasData = f.receivedTime||f.receivedContent||f.guess;
            const btnLabel = hasData ? '修改' : '填写';
            const btnClass = hasData ? 'btn-fill modify' : 'btn-fill';
            html += '<tr><td><strong>'+f.nickname+'</strong></td>'
                + '<td>'+(f.receivedTime||'<span class="empty-cell">—</span>')+'</td>'
                + '<td>'+(f.receivedContent||'<span class="empty-cell">—</span>')+'</td>'
                + '<td>'+guessCell+'</td>'
                + (revealed ? '' : '<td><button class="'+btnClass+'" onclick="openModal(\''+f.nickname+'\')">'+btnLabel+'</button></td>')
                + '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
    }

    function openModal(nickname) {
        if (!isAssigned) {
            showToast("禁止抢跑ᗜ ˰ ᗜ");
            return;
        }
        modalTargetNickname = nickname;
        const existing = currentFeedbacks.find(f => f.nickname===nickname);
        const hasData = existing && (existing.receivedTime||existing.receivedContent||existing.guess);
        document.getElementById('modal-title-text').textContent = hasData ? '修改收到记录' : '填写收到记录';
        document.getElementById('modal-name-hint').textContent = '昵称：'+nickname;
        document.getElementById('modal-pwd').value='';
        // 预填上次数据
        if (existing) {
            document.getElementById('modal-time').value = existing.receivedTime||'';
            document.getElementById('modal-content').value = existing.receivedContent||'';
        } else {
            document.getElementById('modal-time').value='';
            document.getElementById('modal-content').value='';
        }
        const sel = document.getElementById('modal-guess');
        sel.innerHTML='<option value="">-- 我猜是…… --</option>';
        currentNicknameList.forEach(n => {
            if (n!==nickname) { const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); }
        });
        if (existing && existing.guess) sel.value=existing.guess;
        document.getElementById('feedbackModal').classList.add('show');
    }

    function closeModal() { document.getElementById('feedbackModal').classList.remove('show'); }

    async function submitFeedback() {
        const pwd = document.getElementById('modal-pwd').value.trim();
        if (!pwd) return showToast("请输入密码");
        const res = await requestGas({
            action:'submitFeedback', nickname:modalTargetNickname, password:pwd,
            receivedTime:document.getElementById('modal-time').value.trim(),
            receivedContent:document.getElementById('modal-content').value.trim(),
            guess:document.getElementById('modal-guess').value
        }, 'btn-modal-submit');
        showToast(res.message);
        if (res.success) { closeModal(); loadFeedback(); }
    }

    // ── 神秘弹窗 ──
    let secretValue = '';

    function handleOverlayClick(e) {
        if (e.target===document.getElementById('secretOverlay')) closeSecret();
    }

    function closeSecret() {
        document.getElementById('secretOverlay').classList.remove('show');
        secretValue = '';
        updateDisplay();
    }

    function secretInput(digit) {
        if (secretValue.length >= 8) return;
        secretValue += digit;
        updateDisplay();
    }

    function secretDelete() {
        if (secretValue.length > 0) { secretValue = secretValue.slice(0,-1); updateDisplay(); }
    }

    function updateDisplay() {
        const el = document.getElementById('secretDisplay');
        el.textContent = '●'.repeat(secretValue.length);
    }

    function verifySecret() {
        if (!secretValue) return;
        if (secretValue === '08270430') {
            document.getElementById('secretOverlay').classList.remove('show');
            secretValue = '';
            updateDisplay();
            adminUnlocked = true;
            document.getElementById('floatLock').style.display='flex';
            buildNicknameChecks();
            if (sessionStorage.getItem('assignDone')==='1') {
                const b=document.getElementById('btn-assign'); if(b) b.disabled=true;
            }
            if (sessionStorage.getItem('revealDone')==='1') {
                const b=document.getElementById('btn-reveal'); if(b) b.disabled=true;
            }
        } else {
            const box = document.getElementById('secretBox');
            box.classList.add('shake');
            setTimeout(() => { secretValue=''; updateDisplay(); box.classList.remove('shake'); }, 500);
        }
    }

    // ── 长按标题 ──
    const titleEl = document.getElementById('mainTitle');
    function startPress() {
        pressTimer = setTimeout(() => {
            if (adminUnlocked) {
                toggleDrawer();
            } else {
                document.getElementById('secretOverlay').classList.add('show');
            }
        }, 1500);
    }
    function endPress() { clearTimeout(pressTimer); }
    titleEl.addEventListener('touchstart', startPress, {passive:true});
    titleEl.addEventListener('touchend', endPress);
    titleEl.addEventListener('touchcancel', endPress);
    titleEl.addEventListener('mousedown', startPress);
    titleEl.addEventListener('mouseup', endPress);
    titleEl.addEventListener('mouseleave', endPress);
    titleEl.addEventListener('contextmenu', e => e.preventDefault());

    // ── 抽屉 ──
    function toggleDrawer() {
        const drawer = document.getElementById('adminDrawer');
        const overlay = document.getElementById('drawerOverlay');
        const isOpen = drawer.classList.contains('open');
        drawer.classList.toggle('open', !isOpen);
        overlay.classList.toggle('show', !isOpen);
        document.body.style.overflow = isOpen ? '' : 'hidden';
    }

    // ── 管理员操作 ──
    function buildNicknameChecks() {
        const wrap = document.getElementById('nicknameChecks');
        wrap.innerHTML = currentNicknameList.map(n =>
            '<label><input type="checkbox" value="'+n+'" onchange="updSummary()"> '+n+'</label>'
        ).join('');
        updSummary();
    }

    function selectAll(containerId) {
        const cbs = document.querySelectorAll('#'+containerId+' input[type="checkbox"]');
        const allChecked = Array.from(cbs).every(cb=>cb.checked);
        cbs.forEach(cb=>cb.checked=!allChecked);
    }

    function updSummary() {
        const nc = document.querySelectorAll('#nicknameChecks input:checked').length;
        const nt = document.querySelectorAll('#nicknameChecks input').length;
        const fc = document.querySelectorAll('#fieldChecks input:checked').length;
        const ft = document.querySelectorAll('#fieldChecks input').length;
        if (nt>0) document.getElementById('nickSummary').textContent='选择成员（'+nc+'/'+nt+'）';
        document.getElementById('fieldSummary').textContent='查询字段（'+fc+'/'+ft+'）';
    }

    async function adminQuery() {
        const nicknames = Array.from(document.querySelectorAll('#nicknameChecks input:checked')).map(cb=>cb.value);
        const fields = Array.from(document.querySelectorAll('#fieldChecks input:checked')).map(cb=>cb.value);
        if (!nicknames.length) return showToast("请至少选择一个成员");
        if (!fields.length) return showToast("请至少选择一个字段");
        const res = await requestGas({ action:'getDetails', password:'08270430', nicknames, fields }, 'btn-query-admin');
        if (!res.success) { showToast(res.message); return; }
        const wrap = document.getElementById('adminQueryResult');
        if (!res.rows.length) { wrap.innerHTML='<p style="font-size:13px;color:#bbb;margin-top:12px">没有找到数据</p>'; return; }
        let html='<table class="query-table" style="margin-top:14px"><thead><tr><th>昵称</th>';
        res.fields.forEach(f=>{html+='<th>'+(res.labels[f]||f)+'</th>';});
        html+='</tr></thead><tbody>';
        res.rows.forEach(row=>{
            html+='<tr><td class="nm">'+row.nickname+'</td>';
            res.fields.forEach(f=>{html+='<td>'+(row[f]||'—')+'</td>';});
            html+='</tr>';
        });
        html+='</tbody></table>';
        wrap.innerHTML=html;
        document.getElementById('btn-capture').style.display='block';
    }

    async function captureResult() {
        const el = document.getElementById('adminQueryResult');
        if (!el.innerHTML) return;
        const table = el.querySelector('table');
        if (!table) return;
        const canvas = await html2canvas(table, { backgroundColor:'#ffffff', scale:2, scrollX:0, scrollY:0, width:table.scrollWidth, height:table.scrollHeight });
        const a = document.createElement('a');
        a.download='查询结果.png';
        a.href=canvas.toDataURL();
        a.click();
    }

    async function submitAssign() {
        if (!confirm("确认截止报名并开始随机分配吗？分配后无法撤销。")) return;
        const allowMutual = document.getElementById('toggle-mutual').checked;
        const res = await requestGas({ action:'assign', password:'08270430', allowMutual }, 'btn-assign');
        showToast(res.message);
        if (res.success) {
            document.getElementById('btn-assign').disabled=true;
            sessionStorage.setItem('assignDone','1');
            loadList();
        }
    }

    async function submitReveal() {
        if (!confirm("确认现在公布答案吗？揭晓后所有人都能看到谁猜对了。")) return;
        const res = await requestGas({ action:'reveal', password:'08270430' }, 'btn-reveal');
        showToast(res.message);
        if (res.success) {
            document.getElementById('btn-reveal').disabled=true;
            sessionStorage.setItem('revealDone','1');
            loadFeedback();
        }
    }

    async function submitReset() {
        if (!confirm("确认清空全部数据并开启新一轮吗？\n\n此操作完全不可逆！")) return;
        if (!confirm("再次确认：所有报名数据、分配结果、收到记录、站内消息都将被清除。")) return;
        const res = await requestGas({ action:'reset', password:'08270430' }, 'btn-reset');
        showToast(res.message);
        if (res.success) {
            sessionStorage.removeItem('assignDone');
            sessionStorage.removeItem('revealDone');
            ['btn-assign','btn-reveal'].forEach(id=>{
                const b=document.getElementById(id); if(b) b.disabled=false;
            });
            document.getElementById('query-result').style.display='none';
            loadList();
        }
    }

    window.onload = function() { loadList(); refreshTimer = setInterval(loadList, 20000); };
</script>
</body>
</html>
