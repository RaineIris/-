<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘小盲盒</title>
    <style>
        :root {
            --bg-color: #f5f4f1;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #666666;
            --accent: #d97757;
            --accent-hover: #c46347;
            --border: #e6e4df;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
        }
        .nav {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .nav-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            font-size: 14px;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active {
            color: var(--accent);
            font-weight: bold;
            border-bottom: 2px solid var(--accent);
        }
        .content {
            padding: 24px;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-main);
        }
        .form-hint {
            font-size: 12px;
            color: #999999;
            font-weight: normal;
            display: block;
            margin-top: 2px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #faf9f7;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button.primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.primary:hover {
            background-color: var(--accent-hover);
        }
        button.secondary {
            width: 100%;
            padding: 12px;
            background-color: #737373;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }
        button.secondary:hover {
            background-color: #525252;
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 24px;
            padding: 16px;
            background: #fdfaf8;
            border: 1px solid #f2e6e1;
            border-radius: 8px;
        }
        .status-box p {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .refresh-link {
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: opacity 0.2s;
        }
        .refresh-link:hover {
            opacity: 0.8;
        }
        .refresh-link.loading {
            opacity: 0.5;
            pointer-events: none;
        }
        .refresh-link svg {
            margin-right: 4px;
            transform-origin: center;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinning {
            animation: spin 0.8s linear infinite;
        }
        .list-toggle {
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .name-list {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
        }
        .name-list.show {
            display: block;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            margin-top: 4px;
        }
        .radio-group label {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }
        .radio-group input {
            width: auto;
            margin-right: 6px;
            background: none;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="container">
        <div class="header">
            <h1>神秘小盲盒</h1>
        </div>
        
        <div class="nav">
            <button class="nav-btn active" onclick="switchTab('register')">我要报名</button>
            <button class="nav-btn" onclick="switchTab('admin')">管理</button>
        </div>

        <div class="content">
            <div id="register" class="section active">
                <div class="form-group">
                    <label>你的昵称（用于名单公示）</label>
                    <input type="text" id="reg-name" placeholder="输入昵称">
                </div>
                <div class="form-group">
                    <label>你的QQ邮箱（用于接收自动通知）</label>
                    <input type="email" id="reg-email" placeholder="输入邮箱，如：123456@qq.com">
                </div>
                <div class="form-group">
                    <label>是否有忌口要求？</label>
                    <div class="radio-group">
                        <label><input type="radio" name="diet-choice" value="无" checked onclick="toggleDietInput(false)"> 无</label>
                        <label><input type="radio" name="diet-choice" value="有" onclick="toggleDietInput(true)"> 填写</label>
                    </div>
                    <input type="text" id="reg-diet" placeholder="输入忌口（如：不吃香菜等）" style="display: none; margin-top: 6px;">
                </div>
                <div class="form-group">
                    <label>你的地址</label>
                    <textarea id="reg-address" placeholder="详细地址+联系方式（仅对方可见）"></textarea>
                    <span class="form-hint">※ 需要手机号 and 地址，但别填名字</span>
                </div>
                <button class="primary" id="btn-submit" onclick="submitRegister()">提交报名</button>

                <div class="status-box">
                    <p>
                        <span>当前报名人数：<strong id="user-count">0</strong> 人</span>
                        <a class="refresh-link" onclick="triggerRefresh()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                                <path d="M21 3v5h-5"></path>
                            </svg>
                            <span>刷新</span>
                        </a>
                    </p>
                    <span class="list-toggle" onclick="toggleList()">查看已报名名单</span>
                    <div class="name-list" id="user-list">（暂无数据）</div>
                </div>
            </div>

            <div id="admin" class="section">
                <div class="form-group">
                    <label>管理员暗号</label>
                    <input type="password" id="admin-pwd" placeholder="输入暗号">
                </div>
                <button class="primary" id="btn-assign" onclick="submitAssign()">截止报名并触发邮件分配</button>
                <button class="secondary" id="btn-reset" onclick="submitReset()">手动重置表格（备用）</button>
                <p style="font-size: 12px; color: var(--text-light); margin-top: 12px;">注：点击分配后，系统发完通知邮件会全自动销毁并格式化表格所有内容。</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyZFf3xA9zmUIKiF4V_6-ScAeqB8H1GwOsY_07exUez07I1UU0e0ZODRobNSQ1wQuNOyQ/exec"; 
        
        let refreshTimer = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function toggleDietInput(show) {
            document.getElementById('reg-diet').style.display = show ? 'block' : 'none';
            if(!show) document.getElementById('reg-diet').value = '';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'register') {
                loadList();
                refreshTimer = setInterval(loadList, 20000);
            } else {
                clearInterval(refreshTimer);
            }
        }

        function toggleList() {
            document.getElementById('user-list').classList.toggle('show');
        }

        async function requestGas(data, btnId) {
            const btn = document.getElementById(btnId);
            if(btn) { btn.disabled = true; btn.dataset.oldText = btn.innerText; btn.innerText = "处理中..."; }
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(data)
                });
                const res = await response.json();
                
                if(btn) { btn.disabled = false; btn.innerText = btn.dataset.oldText; }
                return res;
            } catch (err) {
                if(btn) { btn.disabled = false; btn.innerText = btn.dataset.oldText; }
                showToast("网络请求失败");
                console.error(err);
                return { success: false, message: "网络异常" };
            }
        }

        async function submitRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const addr = document.getElementById('reg-address').value.trim();
            
            const hasDiet = document.querySelector('input[name="diet-choice"]:checked').value === '有';
            const diet = hasDiet ? document.getElementById('reg-diet').value.trim() : "无";

            if (!name || !email || !addr) return showToast("所有项均为必填项");
            if (hasDiet && !diet) return showToast("请填写你的忌口要求");

            const res = await requestGas({ action: 'register', nickname: name, email: email, address: addr, diet: diet }, 'btn-submit');
            
            if (res.success) {
                showToast("报名成功！");
                document.getElementById('reg-name').value = '';
                document.getElementById('reg-email').value = '';
                document.getElementById('reg-address').value = '';
                document.getElementById('reg-diet').value = '';
                document.querySelectorAll('input[name="diet-choice"]')[0].checked = true;
                toggleDietInput(false);
                loadList();
            } else {
                showToast(res.message);
            }
        }

        async function loadList() {
            const res = await requestGas({ action: 'getList' }, null);
            if (res.success) {
                document.getElementById('user-count').innerText = res.count;
                document.getElementById('user-list').innerText = res.count === 0 ? '（暂无数据）' : res.list.join('，');
            }
        }

        async function triggerRefresh() {
            const link = document.querySelector('.refresh-link');
            const svg = link.querySelector('svg');
            const text = link.querySelector('span');
            
            if (link.classList.contains('loading')) return;
            
            link.classList.add('loading');
            if (svg) svg.classList.add('spinning');
            if (text) text.innerText = "同步中";
            
            await loadList();
            
            link.classList.remove('loading');
            if (svg) svg.classList.remove('spinning');
            if (text) text.innerText = "刷新";
            showToast("名单已同步最新状态");
        }

        async function submitAssign() {
            const pwd = document.getElementById('admin-pwd').value;
            if (!pwd) return showToast("请输入密码");

            const res = await requestGas({ action: 'assign', password: pwd }, 'btn-assign');
            showToast(res.message);
            if(res.success) {
                document.getElementById('admin-pwd').value = '';
                loadList();
            }
        }

        async function submitReset() {
            const pwd = document.getElementById('admin-pwd').value;
            if (!pwd) return showToast("请先在上方输入管理员暗号");
            if (!confirm("确定要清空全部数据再开一局吗？此操作不可逆！")) return;

            const res = await requestGas({ action: 'reset', password: pwd }, 'btn-reset');
            showToast(res.message);
            if(res.success) {
                document.getElementById('admin-pwd').value = '';
                loadList();
            }
        }

        window.onload = () => { loadList(); refreshTimer = setInterval(loadList, 20000); };
    </script>
</body>
</html>
